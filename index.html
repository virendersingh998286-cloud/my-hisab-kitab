
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Hisab Kitab</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #172033;
    }
    .container { max-width: 650px; margin: auto; }
    h1 { text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #687386; margin-bottom: 22px; }
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px #0000000c;
    }
    label { display: block; font-size: 14px; margin: 12px 0 6px; }
    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #235de8;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }
    button.secondary { background: #e8edfa; color: #23427d; }
    button:disabled { opacity: .6; }
    .tabs { display: flex; gap: 10px; }
    .tabs button { flex: 1; }
    .tabs button.active { background: #16794b; }
    .message { margin-top: 12px; font-size: 14px; overflow-wrap: anywhere; }
    .hidden { display: none; }
    .transaction {
      border-bottom: 1px solid #edf0f5;
      padding: 12px 0;
    }
    .transaction:last-child { border-bottom: 0; }
    .tx-top { display: flex; justify-content: space-between; gap: 12px; }
    .income { color: #14804a; }
    .expense { color: #c0392b; }
    .muted { color: #687386; font-size: 13px; margin-top: 5px; }
    .totals { display: flex; gap: 10px; }
    .total-box { flex: 1; min-width: 0; background: #f5f7fb; padding: 12px; border-radius: 9px; }
    .total-box strong { display: block; margin-top: 7px; overflow-wrap: anywhere; }
  </style>
</head>

<body>
<div class="container">
  <h1>My Hisab Kitab</h1>
  <p class="subtitle">Track your income and expenses</p>

  <section class="card" id="authCard">
    <h2 id="authTitle">Login</h2>

    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" minlength="6"
             autocomplete="current-password" required>

      <button id="authButton" type="submit">Login</button>
    </form>

    <button class="secondary" id="switchAuth" type="button">
      Create a new account
    </button>
    <p id="authMessage" class="message" role="status"></p>
  </section>

  <section id="appSection" class="hidden">
    <div class="card">
      <div class="tx-top">
        <div>
          <strong>My transactions</strong>
          <div class="muted" id="userEmail"></div>
        </div>
        <button id="logoutButton" type="button"
                class="secondary" style="width:auto;margin-top:0">
          Logout
        </button>
      </div>
    </div>

    <div class="card">
      <h2>Add transaction</h2>

      <div class="tabs">
        <button type="button" id="expenseTab" class="active">Expense</button>
        <button type="button" id="incomeTab" class="secondary">Income</button>
      </div>

      <form id="transactionForm">
        <label for="txDate">Date</label>
        <input id="txDate" type="date" required>

        <label for="amount">Amount</label>
        <input id="amount" type="number" min="0.01" step="0.01"
               placeholder="Enter amount" required>

        <label for="currency">Currency</label>
        <select id="currency" required>
          <option value="ZMW">ZMW — Zambian Kwacha</option>
          <option value="INR">INR — Indian Rupee</option>
          <option value="USD">USD — US Dollar</option>
        </select>

        <label for="account">Account</label>
        <select id="account" required>
          <option value="cash">Cash</option>
          <option value="bank">Bank</option>
          <option value="home">Home</option>
        </select>

        <label for="category">Category</label>
        <input id="category" type="text"
               placeholder="e.g. Food, Travel, Salary">

        <label for="note">Note</label>
        <input id="note" type="text" placeholder="Optional details">

        <button id="saveButton" type="submit">Save transaction</button>
        <p id="saveMessage" class="message" role="status"></p>
      </form>
    </div>

    <div class="card">
      <h2>Summary</h2>
      <div class="totals">
        <div class="total-box">
          <span class="muted">Income</span>
          <strong id="incomeTotal">0</strong>
        </div>
        <div class="total-box">
          <span class="muted">Expenses</span>
          <strong id="expenseTotal">0</strong>
        </div>
      </div>
      <p class="muted">Totals are grouped by currency below.</p>
    </div>

    <div class="card">
      <div class="tx-top">
        <h2>History</h2>
        <button id="refreshButton" class="secondary" type="button"
                style="width:auto;margin-top:0">Refresh</button>
      </div>
      <div id="history">Loading transactions...</div>
    </div>
  </section>
</div>

<script>
  // Your Supabase project settings
  const SUPABASE_URL = "https://ajkdllnuivbifoagtxee.supabase.co";
  const SUPABASE_KEY = "sb_publishable_JrSxYg_CX5vwsHklYnYW3Q_lCq24I8p";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);

  let currentUser = null;
  let authMode = "login";
  let kind = "expense";

  $("txDate").value = new Date().toLocaleDateString("en-CA");

  function showMessage(id, message, isError = false) {
    $(id).textContent = message;
    $(id).style.color = isError ? "#c0392b" : "#16794b";
  }

  function setKind(newKind) {
    kind = newKind;

    $("expenseTab").className =
      kind === "expense" ? "active" : "secondary";
    $("incomeTab").className =
      kind === "income" ? "active" : "secondary";
  }

  $("expenseTab").addEventListener("click", () => setKind("expense"));
  $("incomeTab").addEventListener("click", () => setKind("income"));

  $("switchAuth").addEventListener("click", () => {
    authMode = authMode === "login" ? "signup" : "login";

    $("authTitle").textContent =
      authMode === "login" ? "Login" : "Create account";
    $("authButton").textContent =
      authMode === "login" ? "Login" : "Create account";
    $("switchAuth").textContent =
      authMode === "login" ? "Create a new account" : "Back to login";
    $("password").autocomplete =
      authMode === "login" ? "current-password" : "new-password";

    showMessage("authMessage", "");
  });

  $("authForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = $("email").value.trim();
    const password = $("password").value;
    const button = $("authButton");

    button.disabled = true;
    showMessage("authMessage", "Please wait...");

    try {
      let result;

      if (authMode === "signup") {
        result = await db.auth.signUp({ email, password });
      } else {
        result = await db.auth.signInWithPassword({ email, password });
      }

      if (result.error) throw result.error;

      if (result.data.session) {
        await handleSession(result.data.session);
      } else {
        showMessage(
          "authMessage",
          "Account request successful. Check your email for confirmation, then log in."
        );
      }
    } catch (error) {
      showMessage("authMessage", error.message, true);
    } finally {
      button.disabled = false;
    }
  });

  async function handleSession(session) {
    currentUser = session ? session.user : null;

    $("authCard").classList.toggle("hidden", !!currentUser);
    $("appSection").classList.toggle("hidden", !currentUser);

    if (currentUser) {
      $("userEmail").textContent = currentUser.email || "";
      await loadTransactions();
    }
  }

  $("logoutButton").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();

    if (error) {
      showMessage("saveMessage", error.message, true);
      return;
    }

    currentUser = null;
    $("authCard").classList.remove("hidden");
    $("appSection").classList.add("hidden");
    showMessage("authMessage", "Logged out.");
  });

  $("transactionForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!currentUser) {
      showMessage("saveMessage", "Please log in again.", true);
      return;
    }

    const amount = Number($("amount").value);

    if (!Number.isFinite(amount) || amount <= 0) {
      showMessage("saveMessage", "Enter a valid amount.", true);
      return;
    }

    // These account values must match the database CHECK constraint.
    const record = {
      user_id: currentUser.id,
      tx_date: $("txDate").value,
      kind: kind,
      amount: amount,
      currency: $("currency").value,
      account: $("account").value,
      transfer_to: null,
      note: $("note").value.trim(),
      category: $("category").value.trim() || null
    };

    const button = $("saveButton");
    button.disabled = true;
    showMessage("saveMessage", "Saving...");

    try {
      const { error } = await db.from("transactions").insert(record);

      if (error) throw error;

      showMessage("saveMessage", "Transaction saved successfully.");

      $("amount").value = "";
      $("category").value = "";
      $("note").value = "";

      await loadTransactions();
    } catch (error) {
      showMessage("saveMessage", "Save error: " + error.message, true);
    } finally {
      button.disabled = false;
    }
  });

  $("refreshButton").addEventListener("click", loadTransactions);

  function formatMoney(amount, currency) {
    return new Intl.NumberFormat("en", {
      maximumFractionDigits: 2
    }).format(Number(amount)) + " " + currency;
  }

  async function loadTransactions() {
    if (!currentUser) return;

    $("history").textContent = "Loading transactions...";

    try {
      const { data, error } = await db
        .from("transactions")
        .select("id, tx_date, kind, amount, currency, account, note, category")
        .eq("user_id", currentUser.id)
        .order("tx_date", { ascending: false })
        .order("created_at", { ascending: false });

      if (error) throw error;

      const rows = data || [];
      const totals = {};

      rows.forEach((row) => {
        const currency = row.currency || "";
        if (!totals[currency]) totals[currency] = { income: 0, expense: 0 };

        if (row.kind === "income") {
          totals[currency].income += Number(row.amount);
        } else if (row.kind === "expense") {
          totals[currency].expense += Number(row.amount);
        }
      });

      const incomeText = Object.entries(totals)
        .map(([currency, total]) => formatMoney(total.income, currency))
        .join(" · ") || "0";

      const expenseText = Object.entries(totals)
        .map(([currency, total]) => formatMoney(total.expense, currency))
        .join(" · ") || "0";

      $("incomeTotal").textContent = incomeText;
      $("expenseTotal").textContent = expenseText;

      if (rows.length === 0) {
        $("history").textContent = "No transactions yet.";
        return;
      }

      $("history").replaceChildren();

      rows.forEach((row) => {
        const item = document.createElement("div");
        item.className = "transaction";

        const top = document.createElement("div");
        top.className = "tx-top";

        const left = document.createElement("strong");
        left.textContent =
          (row.kind === "income" ? "Income" : "Expense") +
          (row.category ? " · " + row.category : "");

        const right = document.createElement("strong");
        right.className = row.kind === "income" ? "income" : "expense";
        right.textContent =
          (row.kind === "income" ? "+" : "−") +
          formatMoney(row.amount, row.currency);

        top.append(left, right);

        const details = document.createElement("div");
        details.className = "muted";
        details.textContent =
          (row.tx_date || "") + " · Account: " + row.account +
          (row.note ? " · " + row.note : "");

        item.append(top, details);
        $("history").appendChild(item);
      });
    } catch (error) {
      $("history").textContent = "Load error: " + error.message;
    }
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") {
      currentUser = null;
      $("authCard").classList.remove("hidden");
      $("appSection").classList.add("hidden");
    }
  });

  (async function init() {
    const { data, error } = await db.auth.getSession();

    if (error) {
      showMessage("authMessage", error.message, true);
      return;
    }

    await handleSession(data.session);
  })();
</script>
</body>
</html>

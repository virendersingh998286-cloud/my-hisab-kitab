
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Hisab Kitab</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f4;color:#19251e;font-family:Arial,sans-serif}
header{background:#176b54;color:white;padding:22px 16px}
main{max-width:700px;margin:auto;padding:15px}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:0 0 14px}
p{overflow-wrap:anywhere}
.card{background:white;border:1px solid #dce5df;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd7cf;border-radius:9px;font-size:16px;background:white}
button{padding:12px;border:0;border-radius:9px;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:#176b54;color:white;width:100%;margin-top:14px}
.secondary{background:#e7f4ee;color:#176b54}
.danger{background:#fff0ef;color:#b42318;padding:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#e7f4ee;padding:13px;border-radius:10px;overflow-wrap:anywhere}
.stat small{display:block;margin-bottom:7px;color:#52675c}
.stat strong{font-size:19px}
.hidden{display:none!important}
.notice{padding:11px;border-radius:8px;margin-top:12px;font-size:14px;overflow-wrap:anywhere}
.error{background:#fff0ef;color:#98251d}
.success{background:#e7f4ee;color:#14563e}
.line{border-top:1px solid #e0e7e2;padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:#68776e;font-size:13px}
.green{color:#14744e;font-weight:bold}
.red{color:#b42318;font-weight:bold}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{background:#e7eee9}
.tab.active{background:#176b54;color:white}
@media(max-width:420px){.row{grid-template-columns:1fr;gap:0}.stat strong{font-size:17px}}
</style>
</head>
<body>
<header>
  <h1>My Hisab Kitab</h1>
  <p style="margin-bottom:0">Your personal income and expense tracker</p>
</header>
<main>
  <section class="card" id="authCard">
    <h2 id="authTitle">Login</h2>
    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" placeholder="Your Gmail">
      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Your password">
      <button class="primary" id="authButton" type="submit">Login</button>
    </form>
    <p><span id="switchText">New user?</span>
      <button class="secondary" id="switchButton" type="button">Create account</button>
    </p>
    <div id="authMsg" class="notice hidden"></div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="top">
        <div><h2>Your Balance</h2><div class="muted" id="userEmail"></div></div>
        <button id="logout" class="secondary" type="button">Log out</button>
      </div>
      <div class="stats">
        <div class="stat"><small>Total income</small><strong id="incomeTotal">ZMW 0.00</strong></div>
        <div class="stat"><small>Total expenses</small><strong id="expenseTotal">ZMW 0.00</strong></div>
        <div class="stat" style="grid-column:1/-1;background:#edf2ff"><small>Balance</small><strong id="balanceTotal">ZMW 0.00</strong></div>
      </div>
    </div>

    <div class="card">
      <h2>Add Transaction</h2>
      <div class="tabs">
        <button id="expenseTab" class="tab active" type="button">Expense</button>
        <button id="incomeTab" class="tab" type="button">Income</button>
      </div>
      <form id="txForm">
        <label for="amount">Amount</label>
        <input id="amount" type="number" min="0.01" step="0.01" required placeholder="Enter amount">
        <div class="row">
          <div>
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category" required>
              <option>Food</option><option>Transport</option><option>Home</option>
              <option>Bills</option><option>Shopping</option><option>Health</option>
              <option>Salary</option><option>Business</option><option>Other</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label for="account">Account</label>
            <select id="account" required>
              <option value="Cash">Cash</option><option value="Bank">Bank</option>
              <option value="Mobile Money">Mobile Money</option>
              <option value="Card">Card</option><option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="currency">Currency</label>
            <select id="currency" required>
              <option value="ZMW">ZMW - Kwacha</option>
              <option value="INR">INR - Rupee</option>
              <option value="USD">USD - Dollar</option>
            </select>
          </div>
        </div>
        <label for="note">Note (optional)</label>
        <textarea id="note" rows="2" placeholder="Transaction details"></textarea>
        <button id="saveButton" class="primary" type="submit">Save Transaction</button>
      </form>
      <div id="saveMsg" class="notice hidden"></div>
    </div>

    <div class="card">
      <div class="top"><h2>Transaction History</h2><button id="refresh" class="secondary" type="button">Refresh</button></div>
      <div id="history"><p class="muted">Loading...</p></div>
      <div id="historyMsg" class="notice hidden"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://ajkdllnuivbifoagtxee.supabase.co";
  const SUPABASE_KEY = "sb_publishable_JrSxYg_CX5vwsHklYnYW3Q_lCq24I8p";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);

  let user = null;
  let mode = "login";
  let kind = "expense";
  let entries = [];

  function message(id, text, success=false) {
    const el = $(id);
    el.textContent = text;
    el.className = "notice " + (success ? "success" : "error");
  }
  function clearMessage(id) {
    $(id).textContent = "";
    $(id).className = "notice hidden";
  }
  function today() {
    const d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }
  function formatMoney(amount, currency="ZMW") {
    try {
      return new Intl.NumberFormat(undefined,{
        style:"currency",currency,maximumFractionDigits:2
      }).format(Number(amount || 0));
    } catch {
      return currency + " " + Number(amount || 0).toFixed(2);
    }
  }
  function setMode(newMode) {
    mode = newMode;
    $("authTitle").textContent = mode === "login" ? "Login" : "Create Account";
    $("authButton").textContent = mode === "login" ? "Login" : "Create Account";
    $("switchText").textContent = mode === "login" ? "New user?" : "Already registered?";
    $("switchButton").textContent = mode === "login" ? "Create account" : "Back to login";
    clearMessage("authMsg");
  }
  $("switchButton").addEventListener("click", () => {
    setMode(mode === "login" ? "signup" : "login");
  });

  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    clearMessage("authMsg");
    $("authButton").disabled = true;
    const email = $("email").value.trim();
    const password = $("password").value;
    try {
      if (mode === "signup") {
        const {data,error} = await db.auth.signUp({email,password});
        if (error) throw error;
        if (data.session) {
          await showApp(data.session.user);
          message("authMsg","Account created successfully.",true);
        } else {
          setMode("login");
          message("authMsg","Account request received. If email confirmation is enabled, confirm your email before logging in.",true);
        }
      } else {
        const {data,error} = await db.auth.signInWithPassword({email,password});
        if (error) throw error;
        await showApp(data.user);
      }
    } catch(err) {
      message("authMsg",err.message || "Login failed.");
    } finally {
      $("authButton").disabled = false;
    }
  });

  async function showApp(signedInUser) {
    user = signedInUser;
    $("authCard").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("userEmail").textContent = user.email || "";
    $("date").value = today();
    await loadEntries();
  }

  $("logout").addEventListener("click", async () => {
    const {error} = await db.auth.signOut();
    if (error) message("saveMsg",error.message);
    user = null;
    $("app").classList.add("hidden");
    $("authCard").classList.remove("hidden");
    setMode("login");
  });

  db.auth.onAuthStateChange((event,session) => {
    if (session && !user) {
      setTimeout(() => showApp(session.user),0);
    }
  });

  function setKind(newKind) {
    kind = newKind;
    $("expenseTab").classList.toggle("active",kind==="expense");
    $("incomeTab").classList.toggle("active",kind==="income");
    const options = kind==="income"
      ? ["Salary","Business","Other"]
      : ["Food","Transport","Home","Bills","Shopping","Health","Other"];
    $("category").innerHTML = options.map(x=>`<option value="${x}">${x}</option>`).join("");
  }
  $("expenseTab").addEventListener("click",()=>setKind("expense"));
  $("incomeTab").addEventListener("click",()=>setKind("income"));

  $("txForm").addEventListener("submit",async e=>{
    e.preventDefault();
    clearMessage("saveMsg");
    if (!user) {
      message("saveMsg","Please log in again.");
      return;
    }
    const amount = Number($("amount").value);
    if (!Number.isFinite(amount) || amount<=0) {
      message("saveMsg","Enter an amount greater than zero.");
      return;
    }
    $("saveButton").disabled = true;
    $("saveButton").textContent = "Saving...";
    const txDate = $("date").value || today();

    // These field names match the actual transactions table.
    const record = {
      user_id: user.id,
      tx_date: txDate,
      kind: kind,
      amount: amount,
      currency: $("currency").value,
      account: $("account").value,
      transfer_to: null,
      note: $("note").value.trim(),
      category: $("category").value
    };

    try {
      const {error} = await db.from("transactions").insert(record);
      if (error) throw error;
      message("saveMsg","Transaction saved successfully.",true);
      $("amount").value = "";
      $("note").value = "";
      await loadEntries();
    } catch(err) {
      message("saveMsg","Save error: " + (err.message || "Unknown error"));
    } finally {
      $("saveButton").disabled = false;
      $("saveButton").textContent = "Save Transaction";
    }
  });

  async function loadEntries() {
    if (!user) return;
    $("history").innerHTML = '<p class="muted">Loading...</p>';
    clearMessage("historyMsg");
    try {
      const {data,error} = await db.from("transactions")
        .select("id,user_id,tx_date,kind,amount,currency,account,note,category,created_at")
        .eq("user_id",user.id)
        .order("tx_date",{ascending:false})
        .order("created_at",{ascending:false})
        .limit(100);
      if (error) throw error;
      entries = data || [];
      renderEntries();
    } catch(err) {
      $("history").innerHTML = "";
      message("historyMsg","Could not load history: " + err.message);
    }
  }

  function escapeText(value) {
    return String(value ?? "").replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function renderEntries() {
    let income = 0, expense = 0;
    entries.forEach(x=>{
      if (x.kind==="income") income += Number(x.amount);
      if (x.kind==="expense") expense += Number(x.amount);
    });
    $("incomeTotal").textContent = formatMoney(income);
    $("expenseTotal").textContent = formatMoney(expense);
    $("balanceTotal").textContent = formatMoney(income-expense);

    if (!entries.length) {
      $("history").innerHTML = '<p class="muted">No transactions yet.</p>';
      return;
    }
    $("history").innerHTML = entries.map(x=>{
      const isIncome = x.kind==="income";
      const title = escapeText(x.category || x.kind);
      const note = escapeText(x.note || "");
      const date = escapeText(x.tx_date || "");
      const account = escapeText(x.account || "");
      const currency = escapeText(x.currency || "ZMW");
      const sign = isIncome ? "+" : "−";
      return `<div class="line">
        <div style="min-width:0">
          <strong>${title}</strong>
          <div class="muted">${date} · ${account}${note ? " · "+note : ""}</div>
        </div>
        <div style="text-align:right">
          <div class="${isIncome ? "green" : "red"}">${sign}${formatMoney(x.amount,currency)}</div>
          <button class="danger" type="button" data-delete="${escapeText(x.id)}">Delete</button>
        </div>
      </div>`;
    }).join("");
  }

  $("history").addEventListener("click",async e=>{
    const btn = e.target.closest("[data-delete]");
    if (!btn) return;
    if (!confirm("Delete this transaction?")) return;
    btn.disabled = true;
    try {
      const {error} = await db.from("transactions").delete()
        .eq("id",btn.dataset.delete).eq("user_id",user.id);
      if (error) throw error;
      await loadEntries();
    } catch(err) {
      message("historyMsg","Delete error: "+err.message);
      btn.disabled = false;
    }
  });
  $("refresh").addEventListener("click",loadEntries);
  $("date").value = today();

  db.auth.getSession().then(({data,error})=>{
    if (error) {
      message("authMsg",error.message);
      return;
    }
    if (data.session) showApp(data.session.user);
  });
})();
</script>
</body>
</html>
